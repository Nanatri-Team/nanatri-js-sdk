<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Backstop for any future XSS in this frame, which holds the access token: only our own
       scripts run, and data can only be sent to the Nanatri API and auth host. The origins in
       connect-src are filled in at build time by scripts/copy-frames.mjs. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https:; connect-src __API_ORIGIN__ __AUTH_ORIGIN__; base-uri 'none'; object-src 'none'" />
  <title>Nanatri</title>
  <link rel="stylesheet" href="/frames/form/style.css" />
  <script src="/frames/shared/locales/en.js"></script>
  <script src="/frames/shared/locales/ka.js"></script>
  <script src="/frames/shared/config.js"></script>
  <script src="/frames/shared/auth.js"></script>
</head>
<body>
  <div class="modal-inner">

    <div class="modal-header">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="ka" type="button">KA</button>
      </div>
      <button id="close-btn" class="close-btn" type="button" aria-label="Close">&#x2715;</button>
    </div>

    <div class="slider-wrapper">
      <div class="slider" id="slider">

        <!-- Screen 1: Sign in (in the popup on the Nanatri auth host) -->
        <div class="slide slide-auth">
          <h2 class="title" id="auth-title">Sign in to Nanatri</h2>
          <p class="subtitle" id="auth-subtitle">Continue in the Nanatri window to add this item.</p>
          <div class="auth-waiting" id="auth-waiting" hidden>
            <div class="spinner"></div>
            <span id="auth-waiting-text">Waiting for you to sign in…</span>
          </div>
          <span class="field-error" id="err-auth" role="alert"></span>
          <button id="sign-in-btn" class="btn-primary" type="button" hidden>Continue with Nanatri</button>
        </div>

        <!-- Screen 2: Success -->
        <div class="slide slide-success">
          <div class="success-icon">&#10003;</div>
          <h2 class="title" id="success-title">Added to your wishlist!</h2>
          <p class="subtitle" id="success-subtitle">Share your wishlist so others can help fund it.</p>

          <div class="item-preview" id="item-preview" hidden>
            <img id="item-preview-image" class="item-preview-image" alt="" />
            <div class="item-preview-info">
              <span id="item-preview-title" class="item-preview-title"></span>
              <span id="item-preview-price" class="item-preview-price"></span>
            </div>
          </div>

          <div class="recent-items" id="recent-items" hidden>
            <span class="recent-items-label" id="recent-items-label">Recently added</span>
            <div class="recent-items-list" id="recent-items-list"></div>
          </div>

          <a id="view-wishlist-link" class="btn-primary" href="#" target="_blank" rel="noopener noreferrer">View my wishlist</a>
          <button id="not-you-btn" class="link-btn" type="button">Not you?</button>
        </div>

      </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
    </div>

  </div>

  <script src="/frames/form/bundle.js"></script>
</body>
</html>
